<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // 文字和控件封顶缩放；大屏通过网格和内容宽度适配，避免整页字号翻倍。
      (function () {
        function setRemBase() {
          var width = window.innerWidth || 375;
          document.documentElement.style.fontSize = (Math.min(width, 480) * 32 / 750) + 'px';
        }
        setRemBase();
        window.addEventListener('resize', setRemBase);
        window.addEventListener('orientationchange', setRemBase);
      })();
    </script>
    <title>KidBridge 彩虹桥</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo/kidbridge-logo.svg" />
    <link rel="apple-touch-icon" href="/static/logo/kidbridge-logo.svg" />
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
