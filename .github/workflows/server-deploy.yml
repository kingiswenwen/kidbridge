name: Build and deploy to server

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR checks may stop; a production deployment must finish/recover.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  h5:
    # Playwright 1.56.1 does not support the Ubuntu 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_CI_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Require dev as the source for main
        if: >-
          github.event_name == 'pull_request' && github.base_ref == 'main' &&
          (github.head_ref != 'dev' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo '::error::Merge changes into the dev branch before opening a PR to main.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Use official npm download URLs without changing locked versions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const value of Object.values(lock.packages)) {
            if (value.resolved?.startsWith('https://registry.npmmirror.com/')) {
              value.resolved = value.resolved.replace('https://registry.npmmirror.com/', 'https://registry.npmjs.org/');
            }
          }
          fs.writeFileSync('package-lock.json', JSON.stringify(lock));
          JS
      - run: npm ci --registry=https://registry.npmjs.org --no-audit --fund=false
      - run: npm run type-check
      - run: npm run test:functional
      - name: Test racing rules, persistence failures and reward transactions
        run: npm run test:racing
      - name: Test deployment preservation and rollback
        run: python3 -m unittest discover -s tests/deployment -v
      - run: npm run build:h5
      - name: Build WeChat mini program
        run: npm run build:mp-weixin
      - name: Test racing journeys and navigation in Chromium
        timeout-minutes: 10
        run: |
          docker run --rm --init --ipc=host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$PLAYWRIGHT_CI_IMAGE" \
            sh -c 'npm run test:racing:e2e && npm run test:navigation'
      - name: Test racing journeys in WebKit
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env RACING_BROWSER=webkit \
            "$PLAYWRIGHT_CI_IMAGE" \
            node tests/racing/browser.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: racing-browser-${{ github.sha }}
          path: |
            artifacts/racing-browser/
            artifacts/racing-webkit/
            artifacts/racing-requirements/
            artifacts/racing-lifecycle/
            artifacts/navigation-browser/
          retention-days: 14
          overwrite: true
      - name: Package release
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('dist/build/h5/kidbridge-release.json')
          path.write_text(json.dumps({'commit': os.environ['COMMIT']}))
          PY
          tar -czf site.tar.gz -C dist/build/h5 .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kidbridge-h5-${{ github.sha }}
          path: site.tar.gz
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  release-check:
    name: Verify release package
    needs: h5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kidbridge-h5-${{ github.sha }}
      - uses: ./.github/actions/setup-live-browser
      - name: Install release into an isolated site and run production checks
        run: python3 tests/deployment/release-smoke.py
      - name: Retain release verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release-smoke/
          retention-days: 14

  promote-dev:
    name: Merge verified dev into main
    needs: [h5, release-check]
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main' &&
      github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Merge the verified PR revision
        env:
          GH_TOKEN: ${{ secrets.DEV_PROMOTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::warning::Automatic merge is inactive until DEV_PROMOTION_TOKEN is configured. See docs/server-cicd.md.'
            exit 0
          fi
          api="repos/$GITHUB_REPOSITORY"
          current_main=$(gh api "$api/git/ref/heads/main" --jq .object.sha)
          current_dev=$(gh api "$api/git/ref/heads/dev" --jq .object.sha)
          if [[ "$current_main" != "$BASE_SHA" || "$current_dev" != "$HEAD_SHA" ]]; then
            echo 'A newer revision needs its own checks. Skipping this merge.'
            exit 0
          fi
          merged=$(gh api --method PUT "$api/pulls/$PR_NUMBER/merge" \
            -f sha="$HEAD_SHA" -f merge_method=merge --jq .merged)
          [[ "$merged" == true ]]

  deploy:
    name: Deploy and verify production
    needs: [h5, release-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: kidbridge-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip superseded releases
        id: release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "### Deployment skipped: main has advanced beyond $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check deployment configuration
        if: steps.release.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=false
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z ${!name} ]]; then
              echo "::error::Missing $name. See docs/server-cicd.md."
              missing=true
            fi
          done
          [[ "$missing" == false ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.release.outputs.current == 'true'
        with:
          name: kidbridge-h5-${{ github.sha }}
      - uses: ./.github/actions/setup-live-browser
        if: steps.release.outputs.current == 'true'
      - name: Deploy and verify production
        if: steps.release.outputs.current == 'true'
        timeout-minutes: 12
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_URL: https://kidbridge.wynsunny.cn
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/kidbridge-ssh.XXXXXXXX")
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          export DEPLOY_IDENTITY_FILE="$ssh_dir/key" DEPLOY_HOSTS_FILE="$ssh_dir/known_hosts"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          bash scripts/deploy-server.sh

      - name: Retain live navigation verification evidence
        if: always() && steps.release.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-navigation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/production-smoke/
            artifacts/deployment/
          retention-days: 14
