name: Check current live illustrations

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: live-illustrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-live-browser
      - name: Verify currently deployed release without changing the server
        env:
          DEPLOY_URL: https://kidbridge.wynsunny.cn/
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-connrefused --retry-max-time 90 "${DEPLOY_URL}kidbridge-release.json" -o /tmp/kidbridge-current-release.json
          live_sha=$(node -e 'const r=require("/tmp/kidbridge-current-release.json");if(!/^[a-f0-9]{40}$/.test(r.commit))throw Error("Invalid live release");process.stdout.write(r.commit)')
          GITHUB_SHA="$live_sha" timeout --signal=TERM --kill-after=15s 300s node tests/navigation/production.mjs
      - name: Exercise live growth journeys in isolated browser storage
        env:
          RACING_TEST_URL: https://kidbridge.wynsunny.cn/
          RACING_ARTIFACTS: artifacts/live-racing-flow
        run: node tests/racing/browser.mjs
      - name: Retain public-site screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-illustrations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/production-smoke/
            artifacts/live-racing-flow/
          retention-days: 14
